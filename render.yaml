# Render Blueprint — Convert My File (Next.js web service)
# Requires: GitHub/GitLab repo connected to Render + RENDER_API_KEY for CLI deploys
services:
  - type: web
    name: convert-my-file
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
