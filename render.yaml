# Render Blueprint — Convert My File (Next.js web service)
services:
  - type: web
    name: convert-my-file
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USERNAME
        value: bapattanmay@gmail.com
      - key: ADMIN_PASSWORD
        value: Bapattanmay@12345
      - key: SESSION_SECRET
        value: convert-my-file-prod-session-secret-2026
      - key: AUTH_SECRET
        value: convert-my-file-prod-auth-secret-2026
      - key: NEXTAUTH_SECRET
        value: convert-my-file-prod-auth-secret-2026
      - key: NEXTAUTH_URL
        value: https://convert-my-file-oo3r.onrender.com
      - key: AUTH_URL
        value: https://convert-my-file-oo3r.onrender.com
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # Set in Render dashboard / API (do not leave empty in production):
      # GOOGLE_CLIENT_ID
      # GOOGLE_CLIENT_SECRET
